name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/bootstrap.py
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Diagnose test-binary loader error (temporary)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== build test binaries without running them ==='
          cargo test --no-run
          Write-Host '=== locate dumpbin ==='
          $dumpbin = $null
          try {
            $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' -ErrorAction Stop | Select-Object -First 1 -ExpandProperty FullName
            Write-Host "dumpbin: $dumpbin"
          } catch { Write-Host "dumpbin not found: $_" }
          if ($dumpbin) {
            $exes = Get-ChildItem 'target\debug\build\nexora\*\out\nexora_lib-*.exe' -ErrorAction SilentlyContinue
            foreach ($exe in $exes) {
              Write-Host "=== imports of $($exe.FullName) ==="
              & $dumpbin /imports $exe.FullName
            }
          }
          $exe = Get-ChildItem 'target\debug\build\nexora\*\out\nexora_lib-*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin -and $exe) {
            Write-Host "=== headers of $($exe.FullName) ==="
            & $dumpbin /headers $exe.FullName | Select-String 'machine|subsystem|manifest|DLL characteristics|operating system version|image version' | Select-Object -First 20
            Write-Host '=== files next to the exe (DLL shadowing check) ==='
            Get-ChildItem $exe.Directory.FullName | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host '=== check every import resolves on this machine ==='
            Add-Type -TypeDefinition @"
            using System;
            using System.Text;
            using System.Runtime.InteropServices;
            public static class Native {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibrary(string lpFileName);
              [DllImport("kernel32.dll", CharSet = CharSet.Ansi, SetLastError = true)]
              public static extern IntPtr GetProcAddress(IntPtr hModule, string lpProcName);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern uint GetModuleFileName(IntPtr hModule, StringBuilder lpFilename, uint nSize);
            }
          "@
            $dump = & $dumpbin /imports $exe.FullName
            $currentDll = $null
            $checked = 0
            $missing = 0
            foreach ($line in $dump) {
              if ($line -match 'forwarder|Import Address|Import Name|time date stamp') { continue }
              if ($line -match '^\s+([A-Za-z0-9_.\-]+\.dll)\s*$') { $currentDll = $Matches[1]; continue }
              if ($line -match '^\s+[0-9A-F]+\s+([A-Za-z_][A-Za-z0-9_]*)\s*$' -and $currentDll) {
                $fn = $Matches[1]
                $h = [Native]::LoadLibrary($currentDll)
                if ($h -eq [IntPtr]::Zero) { Write-Host "LOAD FAILED: $currentDll"; $missing++; continue }
                $p = [Native]::GetProcAddress($h, $fn)
                $checked++
                if ($p -eq [IntPtr]::Zero) { Write-Host "MISSING EXPORT: $currentDll :: $fn"; $missing++ }
              }
            }
            Write-Host "checked $checked imports, missing: $missing"
          }
          Write-Host '=== hello-world Rust test (temporary) ==='
          $tmp = Join-Path $env:TEMP 'hello-test'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          cargo new --lib $tmp --vcs none
          Push-Location $tmp
          cargo test 2>&1 | Select-Object -Last 6
          Pop-Location
          Write-Host '=== diagnostic done (this step never fails the job) ==='

      - name: Run Cargo tests
        working-directory: src-tauri
        run: cargo test
