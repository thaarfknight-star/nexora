<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora</title>
    <script>
      try {
        var t = localStorage.getItem("nexora-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
        var s = localStorage.getItem("nexora-island-size");
        if (s) document.documentElement.style.setProperty("--island-scale", String(Number(s) / 100));
        var g = localStorage.getItem("nexora-island-glow");
        if (g) document.documentElement.style.setProperty("--island-glow", String(Number(g) / 100));
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Vazirmatn:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
