[package]
name = "nexora"
version = "0.1.0"
description = "Floating Dynamic Island shell replacement for Windows 10/11"
authors = ["Taha Arefi"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

# Windows-only: taskbar hide/restore talks to WinAPI directly. Other
# branches that need WinAPI should extend this section's feature list
# (coordinated through DEVagent) instead of adding a second `windows` dep.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
