[package]
name = "nexora"
version = "0.2.19"
description = "Floating Dynamic Island shell replacement for Windows 10/11"
authors = ["Taha Arefi"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Diagnostic builds: `--no-default-features` compiles stats.rs with GPU
# polling fully compiled out (gpu_percent() always returns None and the
# nvml-wrapper dep is not built). Normal builds keep NVML on.
default = ["gpu-nvml"]
gpu-nvml = ["dep:nvml-wrapper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri WITHOUT the `common-controls-v6` default feature, on purpose:
# that feature turns on TaskDialogIndirect (muda's About dialog +
# tauri-runtime-wry's message dialog), a comctl32 v6 API. The app binary
# gets the v6 manifest from tauri-build so it loads fine, but the lib
# test binary gets no manifest, the loader binds comctl32 v5, and the
# whole test binary dies at load with 0xc0000139 before any test runs
# (CI runs 44504317833 / 44637632931). Nexora has no About menu item and
# does not use the dialog plugin, so the fallback (plain MessageBox) is
# never shown. Do NOT re-enable default features without re-checking CI.
# The list below is tauri's default minus common-controls-v6, plus the
# two features Nexora already used (tray-icon, image-png).
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus", "tray-icon", "image-png"] }
tauri-plugin-updater = "2"
# Global hotkey (Alt+Space) for the island: official plugin, v2 line.
tauri-plugin-global-shortcut = "2"
# Real backdrop material for the island (Acrylic on Windows,
# vibrancy on macOS); the CSS glass stays the fallback. Already in
# the tree as a transitive dep at 0.8.1, now used directly.
window-vibrancy = "0.8"
# Raw window handle (version-independent HWND): tauri's `hwnd()`
# returns the `windows` 0.62 `HWND`, while this crate uses 0.61 —
# the two types are identical but distinct, so the handle is taken
# raw here and built into the 0.61 `HWND` in `vibrancy.rs`.
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

# Windows-only: taskbar hide/restore talks to WinAPI directly, and
# media.rs uses the WinRT GSMTC session manager. Other branches that
# need WinAPI should extend this section's feature list (coordinated
# through DEVagent) instead of adding a second `windows` dep.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["ApplicationModel", "Foundation", "Management_Deployment", "Media", "Media_Control", "Storage", "Storage_Search", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Direct dep (default features): windows 0.61 pulls windows-future with
# default-features off, but awaiting IAsyncOperation needs its `std`
# feature (the IntoFuture impls). Feature unification turns it on.
windows-future = "0.2"
# Windows-only: native WASAPI loopback capture (full system playback
# and per-application process-tree loopback — never microphone).
wasapi = "0.27"
# Windows-only: secure API key storage via Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }
# Windows-only: stats.rs reads GPU utilization through NVML (NVIDIA
# driver). nvml-wrapper loads nvml.dll dynamically with libloading, so
# machines without an NVIDIA GPU/driver just get `None` from init.
# Optional: enabled by the `gpu-nvml` default feature; diagnostic
# builds use `--no-default-features` to compile GPU polling out.
nvml-wrapper = { version = "0.12", optional = true }
