[package]
name = "nexora"
version = "0.1.0"
description = "Floating Dynamic Island shell replacement for Windows 10/11"
authors = ["Taha Arefi"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

# Windows-only: taskbar hide/restore talks to WinAPI directly, and
# media.rs uses the WinRT GSMTC session manager. Other branches that
# need WinAPI should extend this section's feature list (coordinated
# through DEVagent) instead of adding a second `windows` dep.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media", "Media_Control", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
# Direct dep (default features): windows 0.61 pulls windows-future with
# default-features off, but awaiting IAsyncOperation needs its `std`
# feature (the IntoFuture impls). Feature unification turns it on.
windows-future = "0.2"
# Windows-only: stats.rs reads GPU utilization through NVML (NVIDIA
# driver). nvml-wrapper loads nvml.dll dynamically with libloading, so
# machines without an NVIDIA GPU/driver just get `None` from init.
nvml-wrapper = "0.12"
